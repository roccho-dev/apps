name: voice-ui browser parity

on:
  pull_request:
    paths:
      - "packages/voice-ui/web/**"
      - "packages/voice-ui/src/session.mjs"
      - "packages/voice-ui/tests/e2e/**"
      - "flake.nix"
      - ".github/workflows/voice-ui-scenarios.yml"

permissions:
  contents: read

concurrency:
  group: voice-ui-browser-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser-parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact apps head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Run temporary accepted browser scenario
        run: nix run --no-write-lock-file .#scenarios
