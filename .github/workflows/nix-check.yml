name: nix-check

on:
  pull_request:
  push:
    branches: [main, proposals]

permissions:
  contents: read

concurrency:
  group: nix-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Check Atlas Purpose Closure
        run: nix shell --inputs-from . nixpkgs#nodejs -c node --test packages/atlas/tests/*.test.mjs
      - name: Run flake check
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          log="nix-flake-check.log"
          actual="$(git rev-parse HEAD)"
          printf 'expected HEAD: %s\nactual HEAD: %s\n' "$EXPECTED_SHA" "$actual" >"$log"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            tail -n 220 "$log" >&2
            exit 1
          fi
          if ! nix flake check --show-trace --no-write-lock-file >>"$log" 2>&1; then
            tail -n 220 "$log" >&2
            exit 1
          fi
          tail -n 80 "$log"
      - name: Upload flake check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-flake-check-log
          path: nix-flake-check.log
          if-no-files-found: ignore
