name: voice-ui artifact

on:
  pull_request:
    paths:
      - ".github/workflows/voice-ui-pages.yml"
      - "flake.nix"
      - "flake.lock"
      - "packages/voice-ui/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-ui-artifact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  artifact:
    name: voice-ui-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact apps head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact apps head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SHA"

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Build complete voice-ui artifact
        shell: bash
        run: |
          set -euo pipefail
          out="$(nix build --no-link --print-out-paths .#voice-ui-dist)"
          python3 packages/voice-ui/dist.py verify --dist "$out"
          rm -rf artifact-output
          mkdir artifact-output
          cp -R "$out"/. artifact-output/
          jq -e --arg sha "$APP_SHA" '.sources.apps == $sha' artifact-output/manifest.json >/dev/null

      - name: Upload exact artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-ui-dist-${{ env.APP_SHA }}
          path: artifact-output
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
