name: voice-ui pages

on:
  pull_request:
    paths:
      - ".github/workflows/voice-ui-pages.yml"
      - "packages/voice-ui/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-ui-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  UI_SHA: 5a2ec2282554f7f9fae6526f3126f81119f81c08
  UI_IR_SHA: 6c40231d991a2099bff8b35eff96055f197a82ae
  OPS_SHA: 1c51c5312a88fec10c6d3ab1e70054f434e6e48c
  ENVS_SHA: 472c047a51e6aef01d8c4bb77e463838a8d6906a
  ENVS_SECRET_BLOB_SHA: 730ff3dbb79e5b86d32c97ab000da2d9898260aa
  PROJECT: voice-ui
  WRANGLER_VERSION: 4.112.0
  EMSDK_VERSION: 4.0.23
  EMSDK_SHA: c0bb220cb6e6f4e0fabb6f6db9efd53390ef5e56

jobs:
  hayamimi-proof:
    name: hayamimi-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact Hayamimi authority
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/ops
          ref: ${{ env.OPS_SHA }}
          path: .proof/ops
          persist-credentials: false

      - name: Verify exact Hayamimi authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .proof/ops rev-parse HEAD)" = "$OPS_SHA"

      - name: Install WASM and browser proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright==1.63.0
          python3 -m playwright install --with-deps chromium
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = "$EMSDK_SHA"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Fetch and verify pinned Hayamimi sources
        shell: bash
        run: |
          set -euo pipefail
          python3 .proof/ops/packages/hayamimi-web/build/fetch.py             --root .proof/ops/packages/hayamimi-web             --work "$RUNNER_TEMP/hayamimi"
          python3 .proof/ops/packages/hayamimi-web/build/verify-sources.py             --root .proof/ops/packages/hayamimi-web             --work "$RUNNER_TEMP/hayamimi"

      - name: Build Hayamimi WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash .proof/ops/packages/hayamimi-web/build/wasm.sh "$RUNNER_TEMP/hayamimi"

      - name: Assemble and verify Hayamimi dist
        shell: bash
        run: |
          set -euo pipefail
          python3 .proof/ops/packages/hayamimi-web/build/assemble.py \
            --root .proof/ops/packages/hayamimi-web \
            --work "$RUNNER_TEMP/hayamimi" \
            --out "$RUNNER_TEMP/hayamimi-dist"
          python3 .proof/ops/packages/hayamimi-web/build/verify-dist.py "$RUNNER_TEMP/hayamimi-dist"

      - name: Real Chromium Hayamimi ASR
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/hayamimi-dist" >"$RUNNER_TEMP/hayamimi-http.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          python3 .proof/ops/packages/hayamimi-web/tests/browser-asr.py \
            http://127.0.0.1:4173/ \
            "$RUNNER_TEMP/hayamimi/sources/hayamimi/tests/golden/ja/ja_014.wav" \
            "$RUNNER_TEMP/hayamimi/sources/hayamimi/tests/golden/ja/golden.json"

      - name: Stage Hayamimi composition input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lane/hayamimi/golden
          cp -R "$RUNNER_TEMP/hayamimi-dist/runtime" .lane/hayamimi/runtime
          cp -R "$RUNNER_TEMP/hayamimi-dist/sherpa" .lane/hayamimi/sherpa
          cp "$RUNNER_TEMP/hayamimi-dist/THIRD_PARTY_NOTICES.md" .lane/hayamimi/THIRD_PARTY_NOTICES.md
          cp "$RUNNER_TEMP/hayamimi/sources/hayamimi/tests/golden/ja/ja_014.wav" .lane/hayamimi/golden/ja_014.wav
          cp "$RUNNER_TEMP/hayamimi/sources/hayamimi/tests/golden/ja/golden.json" .lane/hayamimi/golden/golden.json
          test ! -e .lane/hayamimi/sherpa-pja

      - name: Upload Hayamimi proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: hayamimi-primary-${{ env.OPS_SHA }}
          path: .lane/hayamimi
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  jev-proof:
    name: jev-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ENVS_READ_TOKEN: ${{ secrets.ENVS_READ_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - name: Checkout apps exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify apps and Cloudflare inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Verify Cloudflare Pages project
        shell: bash
        run: |
          set -euo pipefail
          project_api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          response="$(
            curl --silent --show-error               --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "$project_api"
          )"
          if jq -e --arg name "$PROJECT" '.success == true and .result.name == $name' <<<"$response" >/dev/null; then
            exit 0
          fi
          if jq -e 'any(.errors[]?; .code == 8000007 or .code == 8000001)' <<<"$response" >/dev/null; then
            npx --yes wrangler@$WRANGLER_VERSION pages project create "$PROJECT" --production-branch proposals
            exit 0
          fi
          jq -c '{success,errors}' <<<"$response" >&2
          exit 3

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Fetch exact envs ciphertext
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ENVS_READ_TOKEN:-}" ] || [ -z "${SOPS_AGE_KEY:-}" ]; then
            echo "::error::BLOCKED_BY_ENVS_SECRET_PROJECTION" >&2
            exit 78
          fi

          mkdir -p "$RUNNER_TEMP/envs-projection"
          response="$RUNNER_TEMP/envs-projection/response.json"
          cipher="$RUNNER_TEMP/envs-projection/jev-api-key.sops.yaml"

          http_code="$(
            curl --silent --show-error               --output "$response"               --write-out '%{http_code}'               --header "Authorization: Bearer $ENVS_READ_TOKEN"               --header "Accept: application/vnd.github+json"               --header "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/roccho-dev/envs/contents/secrets/jev-api-key.sops.yaml?ref=$ENVS_SHA"
          )"
          if [ "$http_code" != "200" ]; then
            echo "::error::BLOCKED_BY_ENVS_SECRET_PROJECTION" >&2
            jq -c '{message}' "$response" >&2 || true
            exit 78
          fi

          test "$(jq -r '.sha' "$response")" = "$ENVS_SECRET_BLOB_SHA"
          jq -r '.content' "$response" | tr -d '\n' | base64 --decode > "$cipher"
          grep -q '^JEV_API_KEY: ENC\[AES256_GCM,' "$cipher"
          grep -q '^sops:' "$cipher"
          grep -q 'recipient: age1' "$cipher"
          ! grep -q 'AGE-SECRET-KEY-' "$cipher"

          nix_sops="$(
            nix build --no-link --print-out-paths               github:NixOS/nixpkgs/f9948418dc8628ac02b6d6337e191ade9429d59d#sops
          )"
          test -x "$nix_sops/bin/sops"
          printf 'SOPS_BIN=%s/bin/sops\n' "$nix_sops" >> "$GITHUB_ENV"
          printf 'JEV_CIPHER=%s\n' "$cipher" >> "$GITHUB_ENV"

      - name: Real Jev typed response through Pages Function source
        shell: bash
        run: |
          set -euo pipefail
          cat >.jev-proof.mjs <<'NODE'
          import { onRequestPost } from "./packages/voice-ui/functions/api/jev.mjs";

          if (!process.env.JEV_API_KEY) throw new Error("JEV_API_KEY missing");
          const request = new Request("https://local.invalid/api/jev", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              kind: "voice-ui.jev.request.v1",
              text: "real Jev lane proof",
            }),
          });
          const response = await onRequestPost({
            request,
            env: { JEV_API_KEY: process.env.JEV_API_KEY },
          });
          if (response.status !== 200) throw new Error("real Jev call failed");
          const value = await response.json();
          if (
            value?.kind !== "ui.ir.v1" ||
            value?.capability !== "a2ui-browser" ||
            value?.payloadKind !== "a2ui.surface.v1" ||
            !Array.isArray(value?.payload?.components) ||
            typeof value?.payload?.dataModel?.score !== "string"
          ) {
            throw new Error("real Jev typed UI IR contract failed");
          }
          process.stdout.write("jev-proof: PASS real-api typed-ui-ir\n");
          NODE

          export SOPS_AGE_KEY
          "$SOPS_BIN" exec-env "$JEV_CIPHER"             'exec env -u SOPS_AGE_KEY node .jev-proof.mjs'
          rm -f .jev-proof.mjs

      - name: Project exact envs secret to Pages runtime
        shell: bash
        run: |
          set -euo pipefail
          export SOPS_AGE_KEY
          "$SOPS_BIN" --decrypt --output-type json "$JEV_CIPHER"             | jq -er '.JEV_API_KEY'             | npx --yes wrangler@$WRANGLER_VERSION pages secret put JEV_API_KEY --project-name "$PROJECT"

          current="$(npx --yes wrangler@$WRANGLER_VERSION pages secret list --project-name "$PROJECT")"
          grep -q 'JEV_API_KEY' <<<"$current"

  ui-proof:
    name: ui-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout apps exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact UI integration authority
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/ui
          ref: ${{ env.UI_SHA }}
          path: .proof/ui
          persist-credentials: false

      - name: Checkout exact UI IR compatibility authority
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/ui
          ref: ${{ env.UI_IR_SHA }}
          path: .proof/ui-ir
          persist-credentials: false

      - name: Verify exact UI authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          test "$(git -C .proof/ui rev-parse HEAD)" = "$UI_SHA"
          test "$(git -C .proof/ui-ir rev-parse HEAD)" = "$UI_IR_SHA"
          test ! -e .proof/ui/packages/ui-ir
          test -f .proof/ui-ir/packages/ui-ir/src/index.mjs
          test -f .proof/ui/packages/a2ui-browser/src/index.mjs
          test -f .proof/ui/packages/semantic-map/runtime.js
          test -f .proof/ui/packages/semantic-map/renderer-maxgraph/adapter.js
          test -f .proof/ui/packages/semantic-map/vendor/maxgraph/view/GraphDataModel.js

      - name: UI IR compatibility proof
        run: node .proof/ui-ir/packages/ui-ir/tests/run.mjs

      - name: A2UI integration proof
        run: node .proof/ui/packages/a2ui-browser/tests/run.mjs

      - name: Install UI browser proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright==1.63.0
          python3 -m playwright install --with-deps chromium

      - name: Build exact ui271 Semantic Map for apps serve
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ui-proof .proof/ui/.apps-proof
          mkdir -p .ui-proof/site .proof/ui/.apps-proof

          jq '.request.inputs[0].source.value'             .proof/ui/apps/artifact-shell/capabilities/render-semantic-map/fixtures/graph.pass.json             > .proof/ui/.apps-proof/envelope.json

          node .proof/ui/packages/semantic-map/scripts/build-browser-example.mjs             --input=.apps-proof/envelope.json             --out=.apps-proof/dist

          cp -R .proof/ui/.apps-proof/dist/. .ui-proof/site/
          test -s .ui-proof/site/index.html
          test -s .ui-proof/site/receipt.json
          grep -q 'semantic-map-example-build/1' .ui-proof/site/receipt.json
          grep -q 'ui:packages/semantic-map/renderer-maxgraph/adapter.js' .ui-proof/site/index.html
          grep -q 'ui:packages/semantic-map/vendor/maxgraph/' .ui-proof/site/index.html
          grep -q 'render.semantic-map' packages/voice-ui/web/index.html
          grep -q '/ui/semantic-map/runtime.js' packages/voice-ui/web/index.html

      - name: Serve apps Semantic Map and prove maxGraph
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --directory .ui-proof/site >"$RUNNER_TEMP/ui-proof-http.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          python3 packages/voice-ui/tests/ui-maxgraph-serve.py http://127.0.0.1:4174/

  composition-deploy-e2e:
    name: composition-deploy-e2e
    needs:
      - hayamimi-proof
      - jev-proof
      - ui-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout apps exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact UI integration authority
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/ui
          ref: ${{ env.UI_SHA }}
          path: .proof/ui
          persist-credentials: false

      - name: Checkout exact UI IR compatibility authority
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/ui
          ref: ${{ env.UI_IR_SHA }}
          path: .proof/ui-ir
          persist-credentials: false

      - name: Download proven Hayamimi runtime
        uses: actions/download-artifact@v4
        with:
          name: hayamimi-primary-${{ env.OPS_SHA }}
          path: .proof/hayamimi

      - name: Verify composition inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          test "$(git -C .proof/ui rev-parse HEAD)" = "$UI_SHA"
          test -f .proof/hayamimi/runtime/api/hayamimi.mjs
          test -f .proof/hayamimi/sherpa/sherpa-onnx-wasm-main-vad-asr.wasm
          test -f .proof/hayamimi/sherpa/sherpa-onnx-wasm-main-vad-asr.data
          test -f .proof/hayamimi/golden/ja_014.wav
          test -f .proof/hayamimi/golden/golden.json
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Check current deployed state
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments"
          response="$(
            curl --silent --show-error               --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "$api"
          )"
          jq -e '.success == true' <<<"$response" >/dev/null
          printf 'deployment_count=%s\n' "$(jq '.result | length' <<<"$response")"

      - name: Materialize deterministic Pages tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages
          mkdir -p             .pages/site/app             .pages/site/ui/ui-ir             .pages/site/ui/a2ui-browser             .pages/site/ui             .pages/site/hayamimi             .pages/functions/api

          cp packages/voice-ui/web/index.html .pages/site/index.html
          cp -R packages/voice-ui/src .pages/site/app/src
          cp .proof/ui-ir/packages/ui-ir/src/index.mjs .pages/site/ui/ui-ir/index.mjs
          cp -R .proof/ui/packages/a2ui-browser/src/. .pages/site/ui/a2ui-browser/
          cp -R .proof/ui/packages/semantic-map .pages/site/ui/semantic-map
          rm -rf             .pages/site/ui/semantic-map/tests             .pages/site/ui/semantic-map/examples             .pages/site/ui/semantic-map/scripts
          cp -R .proof/hayamimi/runtime .pages/site/hayamimi/runtime
          cp -R .proof/hayamimi/sherpa .pages/site/hayamimi/sherpa
          cp .proof/hayamimi/THIRD_PARTY_NOTICES.md .pages/site/hayamimi/THIRD_PARTY_NOTICES.md
          cp packages/voice-ui/functions/api/jev.mjs .pages/functions/api/jev.mjs

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          site = Path(".pages/site")
          data = site / "hayamimi/sherpa/sherpa-onnx-wasm-main-vad-asr.data"
          chunk_size = 20 * 1024 * 1024
          raw = data.read_bytes()
          parts = []
          for index, start in enumerate(range(0, len(raw), chunk_size)):
              part = raw[start:start + chunk_size]
              name = f"data.part{index:03d}"
              (data.parent / name).write_bytes(part)
              parts.append({
                  "path": name,
                  "bytes": len(part),
                  "sha256": hashlib.sha256(part).hexdigest(),
              })
          (data.parent / "data.parts.json").write_text(
              json.dumps({"bytes": len(raw), "parts": parts}, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          data.unlink()

          sw = r'''const target="/hayamimi/sherpa/sherpa-onnx-wasm-main-vad-asr.data";
          self.addEventListener("install",()=>self.skipWaiting());
          self.addEventListener("activate",event=>event.waitUntil(self.clients.claim()));
          self.addEventListener("fetch",event=>{
            const url=new URL(event.request.url);
            if(event.request.method!=="GET"||url.origin!==self.location.origin||url.pathname!==target)return;
            event.respondWith((async()=>{
              const metaResponse=await fetch("/hayamimi/sherpa/data.parts.json",{cache:"no-store"});
              if(!metaResponse.ok)return new Response("model manifest unavailable",{status:502});
              const meta=await metaResponse.json();
              const stream=new ReadableStream({async start(controller){
                try{
                  for(const part of meta.parts){
                    const response=await fetch("/hayamimi/sherpa/"+part.path);
                    if(!response.ok)throw new Error("model chunk unavailable");
                    const reader=response.body.getReader();
                    while(true){
                      const value=await reader.read();
                      if(value.done)break;
                      controller.enqueue(value.value);
                    }
                  }
                  controller.close();
                }catch(error){controller.error(error);}
              }});
              return new Response(stream,{headers:{
                "content-type":"application/octet-stream",
                "content-length":String(meta.bytes),
                "cache-control":"public, max-age=31536000, immutable"
              }});
            })());
          });'''
          (site / "sw.js").write_text(sw + "\n", encoding="utf-8")

          files = [path for path in site.rglob("*") if path.is_file()]
          limit = 25 * 1024 * 1024
          oversized = [(str(path), path.stat().st_size) for path in files if path.stat().st_size > limit]
          if oversized:
              raise SystemExit(f"Pages file limit exceeded: {oversized}")
          if any("sherpa-pja" in path.as_posix() for path in files):
              raise SystemExit("second-opinion runtime must not be projected")
          if any(b"JEV_API_KEY" in path.read_bytes() for path in files):
              raise SystemExit("JEV secret identifier leaked into public static tree")
          PY

      - name: Check Pages Function build
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@$WRANGLER_VERSION pages functions build .pages/functions             --project-directory .pages             --outfile "$RUNNER_TEMP/voice-ui-worker.js"
          test -s "$RUNNER_TEMP/voice-ui-worker.js"

      - name: Deploy Pages + Pages Functions
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.112.0"
          workingDirectory: ".pages"
          command: >-
            pages deploy site
            --project-name=voice-ui
            --branch=proposals
            --commit-hash=${{ env.APP_SHA }}

      - name: Public readback
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error --retry 10 --retry-delay 3 "$DEPLOYMENT_URL/" -o "$RUNNER_TEMP/deployment-index.html"
          grep -q 'id="surface"' "$RUNNER_TEMP/deployment-index.html"
          curl --fail --silent --show-error --retry 10 --retry-delay 3             "$DEPLOYMENT_URL/ui/semantic-map/runtime.js"             -o "$RUNNER_TEMP/semantic-map-runtime.js"
          curl --fail --silent --show-error --retry 10 --retry-delay 3             "$DEPLOYMENT_URL/ui/semantic-map/renderer-maxgraph/adapter.js"             -o "$RUNNER_TEMP/renderer-maxgraph-adapter.js"
          test -s "$RUNNER_TEMP/semantic-map-runtime.js"
          test -s "$RUNNER_TEMP/renderer-maxgraph-adapter.js"
          if [ -n "$ALIAS_URL" ]; then
            curl --fail --silent --show-error --retry 10 --retry-delay 3 "$ALIAS_URL/" -o "$RUNNER_TEMP/alias-index.html"
            cmp "$RUNNER_TEMP/deployment-index.html" "$RUNNER_TEMP/alias-index.html"
          fi

      - name: Install composition browser proof
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Public type and voice E2E
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          VOICE_WAV: ${{ github.workspace }}/.proof/hayamimi/golden/ja_014.wav
          VOICE_GOLDEN: ${{ github.workspace }}/.proof/hayamimi/golden/golden.json
        shell: bash
        run: |
          set -euo pipefail
          node packages/voice-ui/tests/public-e2e.mjs "$DEPLOYMENT_URL"

      - name: Verify deployed head after E2E
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments"
          response="$(
            curl --silent --show-error               --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "$api"
          )"
          jq -e '.success == true' <<<"$response" >/dev/null
          jq -e --arg sha "$APP_SHA" --arg url "$DEPLOYMENT_URL"             'any(.result[]; .deployment_trigger.metadata.commit_hash == $sha and .latest_stage.status == "success" and .url == $url)'             <<<"$response" >/dev/null

      - name: Result
        env:
