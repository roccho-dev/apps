name: jev-live-proof

on:
  workflow_dispatch:
    inputs:
      envs_sha:
        description: Exact 40-hex roccho-dev/envs commit containing the Jev ciphertext
        required: true
        type: string

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact envs revision
        env:
          ENVS_SHA: ${{ inputs.envs_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${ENVS_SHA}" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact envs authority
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/envs
          ref: ${{ inputs.envs_sha }}
          path: .proof/envs
          persist-credentials: false

      - name: Verify exact envs authority
        env:
          ENVS_SHA: ${{ inputs.envs_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .proof/envs rev-parse HEAD)" = "${ENVS_SHA}"
          test -f .proof/envs/secrets/jev-api-key.sops.yaml
          grep -q '^JEV_API_KEY: ENC\[AES256_GCM,' .proof/envs/secrets/jev-api-key.sops.yaml
          grep -q 'recipient: age1' .proof/envs/secrets/jev-api-key.sops.yaml

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Resolve pinned SOPS
        shell: bash
        run: |
          set -euo pipefail
          out="$(
            nix build --no-link --print-out-paths               github:NixOS/nixpkgs/f9948418dc8628ac02b6d6337e191ade9429d59d#sops
          )"
          test -x "${out}/bin/sops"
          printf 'SOPS_BIN=%s/bin/sops\n' "${out}" >> "${GITHUB_ENV}"

      - name: Decrypt, inject, and prove real Jev consumer
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOPS_AGE_KEY:-}"
          "${SOPS_BIN}" exec-env .proof/envs/secrets/jev-api-key.sops.yaml             'exec env -u JEV_API_KEY -u SOPS_AGE_KEY TYPESAFE_API_KEY="$JEV_API_KEY" node packages/voice-ui/tests/jev-live.mjs'
