<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>voice-ui</title>
    <style>
      #panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      #working-notice { font-weight: bold; }
      /* Every line of the band keeps one line's height whether or not it has
         text, and both pane headings are one row, so neither graph moves when
         a status changes or a list grows. */
      #composer { display: flex; gap: 8px; }
      #text { flex: 1; resize: none; }
      #band p { margin: 2px 0; min-height: 1.4em; line-height: 1.4; }
      .pane-head { display: flex; gap: 8px; align-items: center; height: 2.4rem; }
      .pane-head h2 { margin: 0; font-size: 1.2rem; }
      /* The first screen is the band and both graphs, filling the window by
         layout alone: the graphs take whatever height the band leaves, so no
         window size puts them below the fold. The embed is asked for its
         chrome-free presentation (src/render.mjs), so nothing of its own sits
         over the cells, and its own sizing - min(78vh, 900px), at least 560 px -
         is replaced by the pane's box. Both panes have the same box, so the
         frame read from 作業図 still holds for 確定図. What grows with use - the
         history, the unapplied steps, the conversation - comes after it. */
      body { margin: 0; }
      #stage { box-sizing: border-box; height: 100vh; padding: 8px; display: flex; flex-direction: column; }
      #panes { flex: 1; min-height: 0; grid-template-rows: minmax(0, 1fr); }
      #panes > section { display: flex; flex-direction: column; min-height: 0; }
      #confirmed-surface, #working-surface { flex: 1; min-height: 0; }
      #confirmed-surface iframe, #working-surface iframe { height: 100% !important; min-height: 0 !important; }
      #pane-details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 8px; }
      #context { padding: 0 8px; }
    </style>
  </head>
  <body>
    <main>
      <!-- One short band, then both graphs: what was just said and what it
           drew are on the first screen together, and the next utterance can
           follow at once. Nothing on this screen grows with use. -->
      <div id="stage">
      <div id="band">
        <div id="composer">
          <textarea id="text" aria-label="Input" rows="1"></textarea>
          <button id="send" type="button">Send</button>
          <button id="mic" type="button">Voice</button>
          <!-- Only where nothing is stored: the typed name becomes a new map. -->
          <button id="new" type="button" hidden>新しい図</button>
        </div>
        <p id="status" role="status"></p>
        <p id="working-notice">作業図は保存されていません。再読み込みすると消えます。</p>
        <!-- Parts still in 作業図 that the pane does not show whole. -->
        <p id="out-of-view" aria-live="polite"></p>
        <!-- What the data bundle could not provide, and why. -->
        <p id="bundle-notice" aria-live="polite"></p>
      </div>
      <div id="panes">
        <!-- Left: the saved graph. Only 確定図に反映 changes it. -->
        <section id="confirmed" aria-label="確定図">
          <div class="pane-head"><h2>確定図</h2></div>
          <div id="confirmed-surface"></div>
        </section>
        <!-- Right: the working graph. Speech and typing change only this. -->
        <section id="working" aria-label="作業図">
          <div class="pane-head">
            <h2>作業図</h2>
            <button id="undo" type="button">元に戻す</button>
            <button id="discard" type="button">作業図を破棄</button>
            <button id="apply" type="button">確定図に反映</button>
          </div>
          <div id="working-surface"></div>
        </section>
      </div>
      </div>
      <!-- Under each graph, what grows with use: 確定図's history, 作業図's
           unapplied steps. -->
      <div id="pane-details">
        <section id="history" aria-label="確定図の履歴"></section>
        <div id="working-details">
          <h3 id="draft-heading">未反映の操作</h3>
          <ol id="draft" aria-labelledby="draft-heading"></ol>
          <p id="draft-count"></p>
        </div>
      </div>
      <!-- Earlier utterances Jev judged, exactly as the next request sends them.
           Unverified: only to help Jev understand what an utterance refers to. -->
      <section id="context" aria-labelledby="context-heading">
        <h3 id="context-heading">Jevが参照する最近の会話（未検証）</h3>
        <ol id="context-recent" aria-labelledby="context-heading"></ol>
        <p id="context-skipped"></p>
        <button id="context-clear" type="button">会話をクリア</button>
      </section>
      <!-- The architecture page only: which source snapshot the drawing cites,
           where each drawn record comes from, and what was not analyzed. -->
      <section id="architecture" aria-labelledby="architecture-heading" hidden>
        <h3 id="architecture-heading">構成図の出典（推定を含む・稼働確認ではない）</h3>
        <p id="architecture-status"></p>
        <ul id="architecture-claims" aria-labelledby="architecture-heading"></ul>
        <ul id="architecture-coverage"></ul>
      </section>
    </main>

    <script type="module" src="/app.mjs"></script>
  </body>
</html>
